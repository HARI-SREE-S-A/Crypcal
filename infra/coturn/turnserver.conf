# =============================================================================
# CrypCal coturn Configuration
# TURN/STUN server for WebRTC NAT traversal
# =============================================================================

# Network
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49252

# TURN server realm
realm=__TURN_REALM__

# Authentication: HMAC time-limited credentials (shared with Synapse)
use-auth-secret
static-auth-secret=__TURN_SHARED_SECRET__

# TLS certificates (mounted from Caddy/Let's Encrypt or self-signed)
cert=/etc/coturn/certs/turn.crt
pkey=/etc/coturn/certs/turn.key

# Fingerprint for DTLS
fingerprint

# Disable CLI admin interface
no-cli

# Disable multicast peers
no-multicast-peers

# Disable TCP relay (only UDP relay)
no-tcp-relay

# Denied peer IPs: prevent TURN from being used as a proxy to internal networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Allowed peer IPs: only the LiveKit server (within Docker network)
# The Docker network is 172.20.0.0/16, but we deny all private ranges above
# and allow specific container connections via Docker DNS

# Logging
log-file=stdout
# verbose mode DISABLED for production — enables only error/warning logging
# Uncomment the next line for local debugging only:
# verbose

# Process
proc-quota-size=120
max-bps=0
total-quota=0

# Stale nonce lifetime (seconds)
stale-nonce=600

# No software attribute in TURN messages (reduces fingerprinting)
no-software-attribute
