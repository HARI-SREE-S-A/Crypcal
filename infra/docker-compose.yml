# =============================================================================
# CrypCal — Docker Compose Stack
# =============================================================================
# Services: PostgreSQL, Synapse, Caddy, coturn, LiveKit, lk-jwt-service
# Usage: make setup && make up
# =============================================================================

name: crypcal

services:
  # ===========================================================================
  # PostgreSQL 16 — Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: crypcal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crypcal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Synapse — Matrix Homeserver
  # ===========================================================================
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: crypcal-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - synapse_data:/data
      - ./synapse/generated/homeserver.yaml:/data/homeserver.yaml:ro
      - ./synapse/log.config:/data/log.config:ro
    networks:
      - crypcal
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Caddy — Reverse Proxy + TLS
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: crypcal-caddy
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    environment:
      CRYPCAL_DOMAIN: ${CRYPCAL_DOMAIN}
      TLS_MODE: ${TLS_MODE}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Mount web client build (Milestone 2+)
      - ./web-dist:/srv/web:ro
    networks:
      - crypcal

  # ===========================================================================
  # coturn — TURN/STUN Server
  # ===========================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: crypcal-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/generated/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/certs:/etc/coturn/certs:ro

  # ===========================================================================
  # LiveKit — SFU Media Server
  # ===========================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: crypcal-livekit
    restart: unless-stopped
    volumes:
      - ./livekit/generated/livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      # WebRTC UDP ports
      - "50000-50200:50000-50200/udp"
      # TCP fallback
      - "7881:7881"
    networks:
      - crypcal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # lk-jwt-service — MatrixRTC Authentication
  # ===========================================================================
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: crypcal-lk-jwt
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_healthy
    environment:
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ${CRYPCAL_DOMAIN}
    networks:
      - crypcal

# =============================================================================
# Networks
# =============================================================================
networks:
  crypcal:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  synapse_data:
  caddy_data:
  caddy_config:
